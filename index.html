<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEMI QUIZ · ARCADE CARD UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f0e8dc;
      background-image: 
        radial-gradient(circle at 20% 30%, #fce4b8 0%, transparent 35%),
        radial-gradient(circle at 80% 70%, #f8d0e8 0%, transparent 35%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.2rem 1rem;
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
    }

    /* ===== CARD WRAPPER ===== */
    .game-wrapper {
      max-width: 900px;
      width: 100%;
      position: relative;
    }

    /* Chunky offset shadow like the reference */
    .game-card {
      background: #fffdf5;
      border: 3px solid #2b2b2b;
      border-radius: 24px;
      padding: 1.8rem 1.8rem 1.5rem;
      box-shadow: 
        6px 6px 0 #2b2b2b,
        8px 8px 0 #a89a8a;
      position: relative;
    }

    /* ===== CLOSE BUTTON ===== */
    .close-btn {
      position: absolute;
      top: 14px;
      left: 18px;
      background: transparent;
      border: none;
      font-size: 1.6rem;
      font-weight: 900;
      color: #2b2b2b;
      cursor: pointer;
      line-height: 1;
      transition: transform 0.15s;
      font-family: 'Nunito', sans-serif;
    }
    .close-btn:hover { transform: scale(1.2) rotate(90deg); }

    /* ===== TITLE ===== */
    .game-title {
      text-align: center;
      font-size: 1.7rem;
      font-weight: 900;
      color: #2b2b2b;
      letter-spacing: 1px;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
    }
    .game-title .accent {
      color: #8b6fbf;
    }

    /* ===== INFO PANEL (purple box like reference) ===== */
    .info-panel {
      background: #8b6fbf;
      border: 3px solid #2b2b2b;
      border-radius: 16px;
      padding: 1.2rem 1.4rem;
      margin-bottom: 1.4rem;
      box-shadow: 
        4px 4px 0 #5e4a86,
        6px 6px 0 #2b2b2b;
      text-align: center;
      color: #2b2b2b;
    }
    .info-panel .big {
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 0.3rem;
      color: #fffdf5;
      text-shadow: 1px 1px 0 #2b2b2b;
    }
    .info-panel .small {
      font-size: 0.85rem;
      font-weight: 700;
      color: #e8ddf5;
    }

    /* ===== HUD ROW ===== */
    .hud-row {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .hud-chip {
      background: #fff8e0;
      border: 3px solid #2b2b2b;
      border-radius: 14px;
      padding: 0.5rem 1rem;
      font-weight: 900;
      font-size: 0.85rem;
      color: #2b2b2b;
      box-shadow: 3px 3px 0 #2b2b2b;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .hud-chip .val {
      background: #2b2b2b;
      color: #fffdf5;
      padding: 0.15rem 0.6rem;
      border-radius: 8px;
      font-size: 0.9rem;
      min-width: 30px;
      text-align: center;
    }
    .hud-chip.green { background: #d4f5c4; }
    .hud-chip.yellow { background: #fceb8a; }
    .hud-chip.purple { background: #e0d0f5; }

    /* ===== PROGRESS BAR ===== */
    .progress-track {
      background: #fff8e0;
      border: 3px solid #2b2b2b;
      border-radius: 20px;
      height: 20px;
      margin-bottom: 1.2rem;
      overflow: hidden;
      box-shadow: 3px 3px 0 #2b2b2b;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(
        45deg,
        #c5f06b,
        #c5f06b 8px,
        #a8e04a 8px,
        #a8e04a 16px
      );
      transition: width 0.3s ease;
      border-right: 3px solid #2b2b2b;
    }

    /* ===== QUESTION CARD ===== */
    .question-card {
      background: #fff;
      border: 3px solid #2b2b2b;
      border-radius: 18px;
      padding: 1.3rem 1.4rem 1.4rem;
      margin-bottom: 1.2rem;
      box-shadow: 
        4px 4px 0 #a89a8a,
        6px 6px 0 #2b2b2b;
      position: relative;
    }
    .q-label {
      position: absolute;
      top: -12px;
      left: 16px;
      background: #ff7b7b;
      border: 3px solid #2b2b2b;
      border-radius: 10px;
      padding: 0.15rem 0.7rem;
      font-size: 0.65rem;
      font-weight: 900;
      color: #2b2b2b;
      letter-spacing: 1px;
      box-shadow: 2px 2px 0 #2b2b2b;
    }
    .q-text {
      font-size: 1rem;
      font-weight: 800;
      color: #2b2b2b;
      line-height: 1.5;
      margin: 0.4rem 0 1.2rem;
      display: flex;
      gap: 10px;
    }
    .q-num {
      background: #8b6fbf;
      color: #fffdf5;
      border: 2px solid #2b2b2b;
      border-radius: 8px;
      padding: 0.1rem 0.5rem;
      font-size: 0.8rem;
      flex-shrink: 0;
      height: fit-content;
      box-shadow: 2px 2px 0 #2b2b2b;
    }

    /* ===== OPTIONS ===== */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .option-btn {
      background: #fff8e0;
      border: 3px solid #2b2b2b;
      border-radius: 14px;
      padding: 0.8rem 1rem;
      font-family: 'Nunito', sans-serif;
      font-size: 0.92rem;
      font-weight: 800;
      color: #2b2b2b;
      text-align: left;
      cursor: pointer;
      transition: all 0.12s;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 3px 3px 0 #a89a8a, 4px 4px 0 #2b2b2b;
      line-height: 1.35;
    }
    .option-btn:hover:not(:disabled) {
      background: #fceb8a;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #a89a8a, 6px 6px 0 #2b2b2b;
    }
    .option-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #a89a8a, 2px 2px 0 #2b2b2b;
    }
    .option-btn:disabled { cursor: default; }

    .option-letter {
      background: #8b6fbf;
      color: #fffdf5;
      border: 2px solid #2b2b2b;
      border-radius: 8px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 900;
      flex-shrink: 0;
      box-shadow: 2px 2px 0 #2b2b2b;
    }

    /* Correct state */
    .option-btn.selected-correct {
      background: #c5f06b !important;
      border-color: #2b2b2b !important;
      box-shadow: 3px 3px 0 #7fa83f, 4px 4px 0 #2b2b2b !important;
      animation: pop-correct 0.4s;
    }
    .option-btn.selected-correct .option-letter {
      background: #2b2b2b;
      color: #c5f06b;
    }
    @keyframes pop-correct {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    /* Wrong state */
    .option-btn.selected-wrong {
      background: #ff7b7b !important;
      border-color: #2b2b2b !important;
      color: #fffdf5 !important;
      box-shadow: 3px 3px 0 #b53a3a, 4px 4px 0 #2b2b2b !important;
      animation: shake-wrong 0.4s;
    }
    .option-btn.selected-wrong .option-letter {
      background: #2b2b2b;
      color: #ff7b7b;
    }
    @keyframes shake-wrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* ===== FEEDBACK ===== */
    .feedback-msg {
      margin-top: 0.9rem;
      font-size: 0.9rem;
      font-weight: 900;
      min-height: 1.3rem;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ===== BOTTOM BUTTON ROW (like reference) ===== */
    .bottom-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .square-btn {
      background: #fff8e0;
      border: 3px solid #2b2b2b;
      border-radius: 14px;
      width: 56px;
      height: 56px;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
      box-shadow: 3px 3px 0 #a89a8a, 4px 4px 0 #2b2b2b;
      color: #2b2b2b;
    }
    .square-btn:hover {
      background: #fceb8a;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #a89a8a, 6px 6px 0 #2b2b2b;
    }
    .square-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #a89a8a, 2px 2px 0 #2b2b2b;
    }

    .wide-btn {
      background: #c5f06b;
      border: 3px solid #2b2b2b;
      border-radius: 14px;
      padding: 0.9rem 2rem;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 900;
      color: #2b2b2b;
      cursor: pointer;
      transition: all 0.12s;
      box-shadow: 3px 3px 0 #7fa83f, 4px 4px 0 #2b2b2b;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-width: 160px;
    }
    .wide-btn:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #7fa83f, 6px 6px 0 #2b2b2b;
    }
    .wide-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #7fa83f, 2px 2px 0 #2b2b2b;
    }
    .wide-btn:disabled {
      background: #d8d8d8;
      color: #888;
      box-shadow: 3px 3px 0 #999, 4px 4px 0 #2b2b2b;
      cursor: not-allowed;
    }

    /* ===== RESULT SCREEN ===== */
    .result-screen {
      text-align: center;
    }
    .result-screen .info-panel {
      background: #8b6fbf;
    }
    .big-score {
      font-size: 3.5rem;
      font-weight: 900;
      color: #2b2b2b;
      line-height: 1;
      margin: 0.5rem 0;
      text-shadow: 3px 3px 0 #c5f06b;
    }
    .score-message {
      font-size: 0.95rem;
      font-weight: 800;
      color: #2b2b2b;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .history-box {
      background: #fff8e0;
      border: 3px solid #2b2b2b;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      margin: 1rem 0 1.2rem;
      text-align: left;
      box-shadow: 3px 3px 0 #a89a8a, 4px 4px 0 #2b2b2b;
      max-height: 180px;
      overflow-y: auto;
    }
    .history-box h3 {
      font-size: 0.8rem;
      font-weight: 900;
      color: #2b2b2b;
      margin-bottom: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .history-item {
      background: #e0d0f5;
      border: 2px solid #2b2b2b;
      border-radius: 10px;
      padding: 0.3rem 0.7rem;
      font-size: 0.7rem;
      font-weight: 800;
      color: #2b2b2b;
      box-shadow: 2px 2px 0 #2b2b2b;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .history-item span {
      background: #2b2b2b;
      color: #c5f06b;
      padding: 0.1rem 0.4rem;
      border-radius: 6px;
      font-size: 0.7rem;
    }

    /* ===== PAUSE OVERLAY ===== */
    .pause-overlay {
      position: fixed;
      inset: 0;
      background: rgba(43, 43, 43, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 1rem;
    }
    .pause-overlay.active { display: flex; }

    .pause-card {
      background: #fffdf5;
      border: 3px solid #2b2b2b;
      border-radius: 24px;
      padding: 1.8rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 8px 8px 0 #2b2b2b, 10px 10px 0 #a89a8a;
      text-align: center;
      position: relative;
    }
    .pause-card .close-btn {
      top: 12px;
      left: 16px;
    }
    .pause-card h2 {
      font-size: 1.8rem;
      font-weight: 900;
      color: #2b2b2b;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .pause-card .info-panel {
      margin-bottom: 1.4rem;
    }

    /* ===== BOTTOM DOCK (like reference bottom bar) ===== */
    .dock {
      margin-top: 1.5rem;
      background: #fffdf5;
      border: 3px solid #2b2b2b;
      border-radius: 20px;
      padding: 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      box-shadow: 5px 5px 0 #2b2b2b, 7px 7px 0 #a89a8a;
      flex-wrap: wrap;
    }
    .dock-btn {
      background: #fff8e0;
      border: 3px solid #2b2b2b;
      border-radius: 12px;
      width: 48px;
      height: 48px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
      box-shadow: 3px 3px 0 #2b2b2b;
      color: #2b2b2b;
    }
    .dock-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #2b2b2b;
      background: #fceb8a;
    }
    .dock-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #2b2b2b;
    }
    .dock-btn.special {
      background: #ff7b7b;
    }
    .dock-btn.purple {
      background: #e0d0f5;
    }
    .dock-btn.green {
      background: #c5f06b;
    }
    .dock-btn.yellow {
      background: #fceb8a;
    }
    .dock-settings {
      background: #ff7b7b;
      border: 3px solid #2b2b2b;
      border-radius: 12px;
      padding: 0.5rem 1rem;
      font-family: 'Nunito', sans-serif;
      font-size: 0.8rem;
      font-weight: 900;
      color: #2b2b2b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 3px 3px 0 #2b2b2b;
      transition: all 0.12s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .dock-settings:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #2b2b2b;
    }

    /* ===== IMAGE RAIN ===== */
    #rainContainer {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 99999;
    }
    .rain-image {
      position: absolute;
      top: -150px;
      width: 80px;
      height: 80px;
      object-fit: cover;
      border: 3px solid #2b2b2b;
      border-radius: 12px;
      box-shadow: 4px 4px 0 #2b2b2b;
      animation: fall linear forwards;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0.7; }
    }

    /* ===== HIDDEN ===== */
    .hidden { display: none !important; }

    /* ===== MOBILE ===== */
    @media (max-width: 600px) {
      body { padding: 0.6rem; }
      .game-card { padding: 1.2rem 1rem 1rem; border-radius: 20px; }
      .game-title { font-size: 1.2rem; }
      .info-panel { padding: 0.9rem 1rem; }
      .info-panel .big { font-size: 0.9rem; }
      .info-panel .small { font-size: 0.7rem; }
      .hud-chip { font-size: 0.7rem; padding: 0.4rem 0.7rem; }
      .hud-chip .val { font-size: 0.75rem; }
      .q-text { font-size: 0.85rem; }
      .option-btn { font-size: 0.8rem; padding: 0.7rem 0.8rem; }
      .option-letter { width: 26px; height: 26px; font-size: 0.75rem; }
      .wide-btn { padding: 0.75rem 1.4rem; font-size: 0.85rem; min-width: 130px; }
      .square-btn { width: 48px; height: 48px; font-size: 1.2rem; }
      .big-score { font-size: 2.5rem; }
      .dock-btn { width: 42px; height: 42px; font-size: 1.1rem; }
      .dock-settings { font-size: 0.7rem; padding: 0.4rem 0.7rem; }
      .pause-card h2 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
<div id="rainContainer"></div>

<!-- ===== PAUSE OVERLAY ===== -->
<div class="pause-overlay" id="pauseOverlay">
  <div class="pause-card">
    <button class="close-btn" id="pauseCloseBtn">✕</button>
    <h2>Pause</h2>
    <div class="info-panel">
      <div class="big">Have You Rested?</div>
      <div class="small">Now You Can Continue!</div>
    </div>
    <div class="bottom-row">
      <button class="square-btn" id="pauseHomeBtn" title="Home">🏠</button>
      <button class="wide-btn" id="pauseContinueBtn">Continue</button>
      <button class="square-btn" id="pauseRestartBtn" title="Restart">🔄</button>
    </div>
  </div>
</div>

<!-- ===== MAIN GAME CARD ===== -->
<div class="game-wrapper">
  <div class="game-card" id="gameCard">
    <button class="close-btn" id="mainCloseBtn" title="Pause">✕</button>

    <div class="game-title">⚡ <span class="accent">SEMI</span> QUIZ ⚡</div>

    <!-- QUIZ AREA -->
    <div id="quizArea">
      <!-- Info Panel -->
      <div class="info-panel">
        <div class="big" id="infoBig">Question 1 / 30</div>
        <div class="small" id="infoSmall">Answer correctly to advance</div>
      </div>

      <!-- HUD -->
      <div class="hud-row">
        <div class="hud-chip green">SCORE <span class="val" id="scoreDisplay">0</span></div>
        <div class="hud-chip yellow">STAGE <span class="val" id="stageDisplay">1</span></div>
        <div class="hud-chip purple">ROUND <span class="val" id="roundScoreDisplay">0</span></div>
      </div>

      <!-- Progress -->
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>

      <!-- Question -->
      <div class="question-card">
        <div class="q-label">QUESTION</div>
        <div class="q-text">
          <span class="q-num" id="qNumBadge">01</span>
          <span id="questionText">Loading question...</span>
        </div>
        <div class="options-list" id="optionsContainer"></div>
        <div class="feedback-msg" id="feedbackMsg"></div>
      </div>

      <!-- Bottom Buttons -->
      <div class="bottom-row">
        <button class="square-btn" id="prevBtn" title="Previous" disabled>◀</button>
        <button class="wide-btn" id="nextBtn" disabled>Next ▶</button>
        <button class="square-btn" id="skipBtn" title="Skip">⏭</button>
      </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="resultScreen" class="result-screen hidden">
      <div class="info-panel">
        <div class="big">ROUND COMPLETE</div>
        <div class="small">Here is your score</div>
      </div>

      <div class="big-score" id="finalScore">0/30</div>
      <div class="score-message" id="scoreMessage"></div>

      <div class="history-box">
        <h3>📋 High Scores (Local Storage)</h3>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="bottom-row">
        <button class="wide-btn" id="startNewBtn">🔄 Play Again</button>
      </div>
    </div>

    <!-- Bottom Dock -->
    <div class="dock">
      <button class="dock-btn yellow" id="dockSound" title="Toggle Sound">🔊</button>
      <button class="dock-btn green" id="dockHome" title="Home">🏠</button>
      <button class="dock-btn purple" id="dockReset" title="Reset">🔄</button>
      <button class="dock-btn special" id="dockPause" title="Pause">⏸</button>
      <button class="dock-settings" id="dockSettings">
        <span>⚙️</span> Settings
      </button>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // 300 QUESTION BANK (semiconductor manufacturing)
  // ============================================================
  const questionBank = [
    { q: "What is the starting material for silicon wafer production?", options: ["Pure silicon dioxide powder", "Quartzite sand (SiO₂)", "Trichlorosilane gas", "Metallurgical-grade silicon"], correct: 1 },
    { q: "The carbothermic reduction of quartzite sand is carried out in an arc furnace at approximately what temperature?", options: ["900°C", "1200°C", "1900°C", "2500°C"], correct: 2 },
    { q: "What is the typical purity of metallurgical-grade silicon (MGS)?", options: ["90–95%", "98–99%", "99.9–99.99%", "99.999999%"], correct: 1 },
    { q: "In the Siemens process, silicon is converted to which intermediate compound before purification?", options: ["Silane (SiH₄)", "Silicon tetrachloride (SiCl₄)", "Trichlorosilane (SiHCl₃)", "Silicon dioxide (SiO₂)"], correct: 2 },

    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur);
  }
  function playCorrectSound() {
    playTone(523.25, 0.1, 'square', 0.08, 0);
    playTone(659.25, 0.1, 'square', 0.08, 0.09);
    playTone(783.99, 0.18, 'square', 0.08, 0.18);
    playTone(1046.5, 0.22, 'square', 0.09, 0.28);
  }
  function playWrongSound() {
    playTone(220, 0.13, 'sawtooth', 0.09, 0);
    playTone(185, 0.13, 'sawtooth', 0.09, 0.11);
    playTone(155, 0.22, 'sawtooth', 0.09, 0.22);
    playTone(110, 0.35, 'sawtooth', 0.1, 0.36);
  }
  function playClickSound() { playTone(800, 0.03, 'square', 0.04); }
  function playVictorySound() {
    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5];
    notes.forEach((n, i) => playTone(n, 0.15, 'square', 0.07, i * 0.11));
  }
  function playGameOverSound() {
    [392, 349.23, 311.13, 261.63].forEach((n, i) => playTone(n, 0.28, 'sawtooth', 0.08, i * 0.22));
  }

  // ============================================================
  // IMAGE RAIN
  // ============================================================
  function triggerImageRain(isCorrect) {
    const rainContainer = document.getElementById('rainContainer');
    const imageUrls = isCorrect ? CORRECT_IMAGES : WRONG_IMAGES;
    rainContainer.innerHTML = '';
    for (let i = 0; i < 25; i++) {
      const img = document.createElement('img');
      img.src = imageUrls[i % imageUrls.length];
      img.className = 'rain-image';
      img.style.left = (Math.random() * 100) + '%';
      const size = 50 + Math.random() * 70;
      img.style.width = size + 'px';
      img.style.height = size + 'px';
      img.style.animationDuration = (2 + Math.random() * 1.2) + 's';
      img.style.animationDelay = (Math.random() * 0.7) + 's';
      rainContainer.appendChild(img);
    }
    setTimeout(() => { rainContainer.innerHTML = ''; }, 3000);
  }

  // ============================================================
  // GAME STATE
  // ============================================================
  const QUESTIONS_PER_ROUND = 30;
  let currentRoundQuestions = [];
  let currentIndex = 0;
  let roundScore = 0;
  let answered = false;

  // DOM refs
  const quizArea = document.getElementById('quizArea');
  const resultScreen = document.getElementById('resultScreen');
  const questionText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const qNumBadge = document.getElementById('qNumBadge');
  const infoBig = document.getElementById('infoBig');
  const infoSmall = document.getElementById('infoSmall');
  const stageDisplay = document.getElementById('stageDisplay');
  const roundScoreDisplay = document.getElementById('roundScoreDisplay');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');
  const skipBtn = document.getElementById('skipBtn');
  const feedbackMsg = document.getElementById('feedbackMsg');
  const finalScore = document.getElementById('finalScore');
  const scoreMessage = document.getElementById('scoreMessage');
  const historyList = document.getElementById('historyList');
  const startNewBtn = document.getElementById('startNewBtn');
  const progressBar = document.getElementById('progressBar');
  const pauseOverlay = document.getElementById('pauseOverlay');

  // Helpers
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Local storage
  function getScoreHistory() {
    const s = localStorage.getItem('semiQuizScoresCard');
    return s ? JSON.parse(s) : [];
  }
  function saveScoreToHistory(score) {
    const history = getScoreHistory();
    const date = new Date().toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    history.push({ score, date });
    if (history.length > 10) history.shift();
    localStorage.setItem('semiQuizScoresCard', JSON.stringify(history));
    renderHistory();
  }
  function renderHistory() {
    const history = getScoreHistory();
    if (!historyList) return;
    if (history.length === 0) {
      historyList.innerHTML = '<div class="history-item" style="opacity:0.6;">No scores yet</div>';
      return;
    }
    historyList.innerHTML = history.map(e =>
      `<div class="history-item">${e.date} <span>${e.score}/30</span></div>`
    ).join('');
  }

  // Start round
  function startNewRound() {
    initAudio();
    const shuffled = shuffleArray([...questionBank]);
    currentRoundQuestions = shuffled.slice(0, QUESTIONS_PER_ROUND);
    currentIndex = 0;
    roundScore = 0;
    answered = false;
    stageDisplay.textContent = '1';
    roundScoreDisplay.textContent = '0';
    scoreDisplay.textContent = '0';
    quizArea.classList.remove('hidden');
    resultScreen.classList.add('hidden');
    updateProgress();
    renderQuestion();
  }

  function updateProgress() {
    const pct = Math.round((currentIndex / QUESTIONS_PER_ROUND) * 100);
    progressBar.style.width = pct + '%';
  }

  // Render question
  function renderQuestion() {
    const q = currentRoundQuestions[currentIndex];
    if (!q) return;
    answered = false;
    nextBtn.disabled = true;
    prevBtn.disabled = currentIndex === 0;
    feedbackMsg.textContent = '';

    qNumBadge.textContent = String(currentIndex + 1).padStart(2, '0');
    infoBig.textContent = `Question ${currentIndex + 1} / ${QUESTIONS_PER_ROUND}`;
    infoSmall.textContent = 'Pick the correct answer';
    stageDisplay.textContent = currentIndex + 1;
    questionText.textContent = q.q;

    optionsContainer.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${opt}</span>`;
      btn.dataset.optionIndex = idx;
      btn.addEventListener('click', () => handleOptionClick(idx, btn));
      optionsContainer.appendChild(btn);
    });
    updateProgress();
  }

  // Handle option click
  function handleOptionClick(optIdx, btnElement) {
    if (answered) return;
    const q = currentRoundQuestions[currentIndex];
    const isCorrect = (optIdx === q.correct);
    answered = true;

    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    const allBtns = document.querySelectorAll('.option-btn');

    if (isCorrect) {
      btnElement.classList.add('selected-correct');
      roundScore += 1;
      feedbackMsg.textContent = '✓ CORRECT! +1';
      feedbackMsg.style.color = '#4a8a2f';
      playCorrectSound();
    } else {
      btnElement.classList.add('selected-wrong');
      feedbackMsg.textContent = `✗ WRONG! ANSWER: ${String.fromCharCode(65 + q.correct)}`;
      feedbackMsg.style.color = '#b53a3a';
      allBtns[q.correct].classList.add('selected-correct');
      playWrongSound();
    }

    triggerImageRain(isCorrect);
    roundScoreDisplay.textContent = roundScore;
    scoreDisplay.textContent = roundScore;
    nextBtn.disabled = false;
    infoSmall.textContent = isCorrect ? 'Correct!' : 'Better luck next time!';
    updateProgress();
  }

  // Next
  function goToNext() {
    if (!answered) return;
    playClickSound();
    if (currentIndex + 1 < QUESTIONS_PER_ROUND) {
      currentIndex++;
      renderQuestion();
    } else {
      finishRound();
    }
  }

  // Prev (just navigate back visually — does not allow re-answering)
  function goToPrev() {
    if (currentIndex > 0) {
      playClickSound();
      currentIndex--;
      renderQuestion();
      // Show previous answer state (already answered, so show feedback)
      const q = currentRoundQuestions[currentIndex];
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);
      // We don't know which was selected — just highlight the correct one
      allBtns[q.correct].classList.add('selected-correct');
      nextBtn.disabled = false;
      answered = true;
      feedbackMsg.textContent = `Review: correct answer is ${String.fromCharCode(65 + q.correct)}`;
      feedbackMsg.style.color = '#8b6fbf';
    }
  }

  // Skip
  function skipQuestion() {
    if (answered) {
      goToNext();
      return;
    }
    playClickSound();
    // Count as wrong and move on
    const q = currentRoundQuestions[currentIndex];
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);
    allBtns[q.correct].classList.add('selected-correct');
    feedbackMsg.textContent = `Skipped! Answer: ${String.fromCharCode(65 + q.correct)}`;
    feedbackMsg.style.color = '#b53a3a';
    playWrongSound();
    triggerImageRain(false);
    answered = true;
    nextBtn.disabled = false;
    updateProgress();
  }

  // Finish round
  function finishRound() {
    saveScoreToHistory(roundScore);
    quizArea.classList.add('hidden');
    resultScreen.classList.remove('hidden');
    finalScore.textContent = `${roundScore}/${QUESTIONS_PER_ROUND}`;
    const pct = Math.round((roundScore / QUESTIONS_PER_ROUND) * 100);
    let msg = '';
    if (pct >= 90) { msg = '🏆 LEGENDARY! You are exam ready.'; playVictorySound(); }
    else if (pct >= 70) { msg = '👍 Great job! Almost there.'; playVictorySound(); }
    else if (pct >= 50) { msg = '📘 Not bad. Review the tricky ones.'; playGameOverSound(); }
    else { msg = '📚 Keep grinding — you got this!'; playGameOverSound(); }
    scoreMessage.textContent = `${pct}% · ${msg}`;
    renderHistory();
  }

  // Pause
  function togglePause() {
    playClickSound();
    pauseOverlay.classList.toggle('active');
  }
  function closePause() { playClickSound(); pauseOverlay.classList.remove('active'); }

  // ============================================================
  // EVENT LISTENERS
  // ============================================================
  nextBtn.addEventListener('click', goToNext);
  prevBtn.addEventListener('click', goToPrev);
  skipBtn.addEventListener('click', skipQuestion);
  startNewBtn.addEventListener('click', () => { playClickSound(); startNewRound(); });
  document.getElementById('mainCloseBtn').addEventListener('click', togglePause);
  document.getElementById('pauseCloseBtn').addEventListener('click', closePause);
  document.getElementById('pauseContinueBtn').addEventListener('click', closePause);
  document.getElementById('pauseRestartBtn').addEventListener('click', () => { closePause(); startNewRound(); });
  document.getElementById('pauseHomeBtn').addEventListener('click', () => { closePause(); startNewRound(); });
  document.getElementById('dockPause').addEventListener('click', togglePause);
  document.getElementById('dockReset').addEventListener('click', () => { playClickSound(); startNewRound(); });
  document.getElementById('dockHome').addEventListener('click', () => { playClickSound(); startNewRound(); });
  document.getElementById('dockSettings').addEventListener('click', () => { playClickSound(); togglePause(); });
  document.getElementById('dockSound').addEventListener('click', function() {
    soundEnabled = !soundEnabled;
    this.textContent = soundEnabled ? '🔊' : '🔇';
    if (soundEnabled) playClickSound();
  });

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') togglePause();
    if (e.key === 'Enter' && !nextBtn.disabled) goToNext();
  });

  // Init
  function initGame() {
    renderHistory();
    startNewRound();
  }
  initGame();
</script>
</body>
</html>
